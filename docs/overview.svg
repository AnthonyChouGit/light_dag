<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e" />
    </marker>
    <marker id="arrow-error" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149" />
    </marker>
    <marker id="arrow-success" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .node-title { font-size: 13px; font-weight: 600; fill: #e6edf3; }
    .node-sub { font-size: 11px; fill: #8b949e; }
    .badge-text { font-size: 12px; font-weight: 600; fill: #58a6ff; }
    .conn { fill: none; stroke: #58a6ff; stroke-width: 1.75; }
    .conn-ctx { fill: none; stroke: #8b949e; stroke-width: 1.35; stroke-dasharray: 4,3; }
    .conn-err { fill: none; stroke: #f85149; stroke-width: 1.5; stroke-dasharray: 4,4; opacity: 0.78; }
  </style>

  <!-- Outer Frame -->
  <rect x="10" y="10" width="860" height="390" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  <text x="440" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">LightDAG Execution Architecture</text>

  <!-- ==================== CONNECTORS ==================== -->
  <!-- Inputs -> Main-Thread & Worker-Thread Operators -->
  <path d="M 195 108 L 195 136" class="conn" marker-end="url(#arrow)" />
  <path d="M 215 108 L 215 119 L 445 119 L 445 136" class="conn" marker-end="url(#arrow)" />

  <!-- Context & Options -> Main-Thread & Worker-Thread Operators -->
  <path d="M 465 108 L 465 136" class="conn-ctx" marker-end="url(#arrow-muted)" />
  <path d="M 445 108 L 445 127 L 230 127 L 230 136" class="conn-ctx" marker-end="url(#arrow-muted)" />

  <!-- Parallel Operators -> Branch & Merge Node -->
  <path d="M 195 190 L 195 218 L 295 218 L 295 241" class="conn" marker-end="url(#arrow)" />
  <path d="M 465 190 L 465 218 L 365 218 L 365 241" class="conn" marker-end="url(#arrow)" />

  <!-- Branch & Merge -> Resolved Outputs -->
  <path d="M 330 295 L 330 324" class="conn" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-success)" />

  <!-- Error Paths -> Error Boundary -->
  <path d="M 300 165 L 330 165 L 330 202 L 605 202 C 625 202, 625 214, 646 214" class="conn-err" marker-end="url(#arrow-error)" />
  <path d="M 570 165 C 612 165, 612 226, 646 226" class="conn-err" marker-end="url(#arrow-error)" />
  <path d="M 440 270 C 565 270, 585 242, 646 242" class="conn-err" marker-end="url(#arrow-error)" />

  <!-- Error Boundary -> Safe Drain -->
  <path d="M 745 266 L 745 322" stroke="#f85149" stroke-width="2" fill="none" marker-end="url(#arrow-error)" />

  <!-- ==================== NODES ==================== -->
  <!-- Inputs & Context Pills -->
  <g filter="url(#shadow)">
    <rect x="130" y="68" width="140" height="40" rx="20" fill="#161b22" stroke="#388bfd" stroke-width="2" />
    <text x="200" y="93" text-anchor="middle" class="badge-text">● Inputs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="375" y="68" width="175" height="40" rx="20" fill="#161b22" stroke="#30363d" stroke-width="1.75" />
    <text x="462.5" y="93" text-anchor="middle" font-size="12" font-weight="600" fill="#c9d1d9">⚙ Context &amp; Options</text>
  </g>

  <!-- Parallel Level 1 -->
  <g filter="url(#shadow)">
    <rect x="90" y="140" width="210" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="195" y="162" text-anchor="middle" class="node-title">◆ Main-Thread Operator</text>
    <text x="195" y="178" text-anchor="middle" class="node-sub">Async I/O · Shared Context</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="140" width="210" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <text x="465" y="162" text-anchor="middle" class="node-title">✦ Worker-Thread Operator</text>
    <text x="465" y="178" text-anchor="middle" class="node-sub">Piscina Pool · Serializable Data</text>
  </g>

  <!-- Join / Branch Node -->
  <g filter="url(#shadow)">
    <rect x="220" y="245" width="220" height="50" rx="8" fill="#21262d" stroke="#d29922" stroke-width="1.5" />
    <text x="330" y="267" text-anchor="middle" class="node-title" fill="#f0e6c8">▸ Branch &amp; Merge</text>
    <text x="330" y="283" text-anchor="middle" class="node-sub">Zod Validation · Promise Barrier</text>
  </g>

  <!-- Terminal Success -->
  <g filter="url(#shadow)">
    <rect x="230" y="328" width="200" height="44" rx="22" fill="#1b4728" stroke="#3fb950" stroke-width="2" />
    <text x="330" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#3fb950">✓ Resolved Outputs</text>
  </g>

  <!-- Error Boundary Node -->
  <g filter="url(#shadow)">
    <rect x="650" y="192" width="190" height="74" rx="8" fill="#381a1e" stroke="#f85149" stroke-width="1.5" />
    <text x="745" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#f85149">⚡ Error Boundary</text>
    <text x="745" y="234" text-anchor="middle" font-size="11" fill="#e6edf3">Unified Handler &amp; Fallback</text>
    <text x="745" y="250" text-anchor="middle" font-size="10.5" fill="#8b949e">Auto-catches framework &amp; exec</text>
  </g>

  <!-- Terminal Safe Drain -->
  <g filter="url(#shadow)">
    <rect x="650" y="326" width="190" height="44" rx="22" fill="#381a1e" stroke="#f85149" stroke-width="2" />
    <text x="745" y="353" text-anchor="middle" font-size="13" font-weight="700" fill="#f85149">✕ Abort &amp; Drain Tasks</text>
  </g>
</svg>
