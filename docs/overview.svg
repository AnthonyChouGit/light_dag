<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .title { font-size: 16px; font-weight: 700; fill: #f0f6fc; letter-spacing: 0.5px; }
    .node-title { font-size: 14px; font-weight: 600; fill: #e6edf3; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #e6edf3; }
    .accent { fill: #58a6ff; }
    .step { font-size: 12px; font-weight: 700; fill: #58a6ff; }
    .conn { fill: none; stroke: #58a6ff; stroke-width: 1.75; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .chip { fill: #21262d; stroke: #30363d; stroke-width: 1; }
  </style>

  <rect x="10" y="10" width="860" height="280" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  <text x="440" y="42" text-anchor="middle" class="title">LightDAG — Define · Wire · Run</text>

  <!-- Connectors -->
  <path d="M 283 167 L 309 167" class="conn" marker-end="url(#arrow)" />
  <path d="M 568 167 L 594 167" class="conn" marker-end="url(#arrow)" />

  <!-- Card 1: Define -->
  <g filter="url(#shadow)"><rect x="30" y="65" width="250" height="205" rx="10" class="card" /></g>
  <circle cx="60" cy="97" r="13" fill="#0d1117" stroke="#388bfd" stroke-width="1.5" />
  <text x="60" y="101.5" text-anchor="middle" class="step">1</text>
  <text x="82" y="95" class="node-title">Define operators</text>
  <text x="82" y="112" class="mono accent">operators/*.operator.ts</text>
  <line x1="45" y1="127" x2="265" y2="127" stroke="#30363d" />
  <rect x="45" y="141" width="220" height="30" rx="6" class="chip" />
  <text x="155" y="160" text-anchor="middle" class="mono">Zod schemas</text>
  <rect x="45" y="179" width="220" height="30" rx="6" class="chip" />
  <text x="155" y="198" text-anchor="middle" class="mono">export default exec()</text>
  <rect x="45" y="217" width="220" height="30" rx="6" class="chip" />
  <text x="155" y="236" text-anchor="middle" class="mono">class XxxOperator</text>

  <!-- Card 2: Wire -->
  <g filter="url(#shadow)"><rect x="315" y="65" width="250" height="205" rx="10" class="card" /></g>
  <circle cx="345" cy="97" r="13" fill="#0d1117" stroke="#388bfd" stroke-width="1.5" />
  <text x="345" y="101.5" text-anchor="middle" class="step">2</text>
  <text x="367" y="95" class="node-title">Wire the graph</text>
  <text x="367" y="112" class="mono accent">pipeline.dag.ts</text>
  <line x1="330" y1="127" x2="550" y2="127" stroke="#30363d" />
  <rect x="330" y="141" width="220" height="30" rx="6" class="chip" />
  <text x="440" y="160" text-anchor="middle" class="mono">new XxxOperator()</text>
  <rect x="330" y="179" width="220" height="30" rx="6" class="chip" />
  <text x="440" y="198" text-anchor="middle" class="mono">.setName() · .mapInput() …</text>
  <rect x="330" y="217" width="220" height="30" rx="6" class="chip" />
  <text x="440" y="236" text-anchor="middle" class="mono">new LightDag([...ops])</text>

  <!-- Card 3: Run -->
  <g filter="url(#shadow)"><rect x="600" y="65" width="250" height="205" rx="10" class="card" /></g>
  <circle cx="630" cy="97" r="13" fill="#0d1117" stroke="#388bfd" stroke-width="1.5" />
  <text x="630" y="101.5" text-anchor="middle" class="step">3</text>
  <text x="652" y="95" class="node-title">Run &amp; clean up</text>
  <text x="652" y="112" class="mono accent">run.ts</text>
  <line x1="615" y1="127" x2="835" y2="127" stroke="#30363d" />
  <rect x="615" y="141" width="220" height="30" rx="6" class="chip" />
  <text x="725" y="160" text-anchor="middle" class="mono">.setOnError() · .setTimeout()</text>
  <rect x="615" y="179" width="220" height="30" rx="6" class="chip" />
  <text x="725" y="198" text-anchor="middle" class="mono">await dag.run(...)</text>
  <rect x="615" y="217" width="220" height="30" rx="6" class="chip" />
  <text x="725" y="236" text-anchor="middle" class="mono">finally { cleanUp() }</text>
</svg>

