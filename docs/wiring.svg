<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-urgent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f0883e" />
    </marker>
    <marker id="arrow-success" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .title { font-size: 16px; font-weight: 700; fill: #f0f6fc; letter-spacing: 0.5px; }
    .node-title { font-size: 13px; font-weight: 600; fill: #e6edf3; }
    .node-sub { font-size: 11px; fill: #8b949e; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #8b949e; }
    .badge-text { font-size: 12px; font-weight: 600; fill: #58a6ff; }
    .ok-text { font-size: 12px; font-weight: 600; fill: #3fb950; }
    .node { fill: #21262d; stroke: #30363d; stroke-width: 1.5; }
    .conn { fill: none; stroke: #58a6ff; stroke-width: 1.75; }
    .conn-urgent { fill: none; stroke: #f0883e; stroke-width: 1.75; }
    .conn-ok { fill: none; stroke: #3fb950; stroke-width: 2; }
  </style>

  <rect x="10" y="10" width="860" height="550" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  <text x="440" y="42" text-anchor="middle" class="title">Conditional Branching &amp; Operator Reuse</text>

  <!-- ==================== CONNECTORS ==================== -->
  <path d="M 440 102 L 440 125" class="conn" marker-end="url(#arrow)" />

  <!-- urgent branch -->
  <path d="M 410 182 L 410 265" class="conn-urgent" marker-end="url(#arrow-urgent)" />
  <path d="M 410 220 L 170 220 L 170 265" class="conn-urgent" marker-end="url(#arrow-urgent)" />
  <path d="M 170 322 L 170 360 L 260 360 L 260 385" class="conn-urgent" marker-end="url(#arrow-urgent)" />
  <path d="M 410 322 L 410 360 L 320 360 L 320 385" class="conn-urgent" marker-end="url(#arrow-urgent)" />
  <path d="M 290 442 L 290 467" class="conn-ok" marker-end="url(#arrow-success)" />

  <!-- normal branch -->
  <path d="M 500 182 L 500 220 L 720 220 L 720 265" class="conn" marker-end="url(#arrow)" />
  <path d="M 720 322 L 720 467" class="conn" marker-end="url(#arrow)" />

  <!-- edge labels: global task names -->
  <rect x="205" y="209" width="170" height="22" rx="11" fill="#0d1117" stroke="#f0883e" stroke-width="1" />
  <text x="290" y="224" text-anchor="middle" class="mono" style="fill:#f0883e">⚡ urgent → urgent_msg</text>
  <rect x="525" y="209" width="170" height="22" rx="11" fill="#0d1117" stroke="#58a6ff" stroke-width="1" />
  <text x="610" y="224" text-anchor="middle" class="mono" style="fill:#58a6ff">● normal → normal_msg</text>
  <text x="178" y="346" class="mono">sms_sent</text>
  <text x="402" y="346" text-anchor="end" class="mono">email_sent</text>

  <!-- ==================== NODES ==================== -->
  <g filter="url(#shadow)">
    <rect x="330" y="64" width="220" height="38" rx="19" fill="#161b22" stroke="#388bfd" stroke-width="2" />
    <text x="440" y="88" text-anchor="middle" class="badge-text">● severity · message</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="130" width="220" height="52" rx="8" class="node" />
    <text x="440" y="152" text-anchor="middle" class="node-title">▸ route_alert</text>
    <text x="440" y="170" text-anchor="middle" class="node-sub">RouteAlertOperator</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="270" width="200" height="52" rx="8" class="node" />
    <text x="170" y="292" text-anchor="middle" class="node-title">✦ send_sms</text>
    <text x="170" y="310" text-anchor="middle" class="node-sub">SendChannelOperator ♻</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="310" y="270" width="200" height="52" rx="8" class="node" />
    <text x="410" y="292" text-anchor="middle" class="node-title">✉ send_email</text>
    <text x="410" y="310" text-anchor="middle" class="node-sub">SendChannelOperator ♻</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="270" width="200" height="52" rx="8" class="node" />
    <text x="720" y="292" text-anchor="middle" class="node-title">◆ send_log</text>
    <text x="720" y="310" text-anchor="middle" class="node-sub">SendChannelOperator ♻</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="190" y="390" width="200" height="52" rx="8" class="node" />
    <text x="290" y="412" text-anchor="middle" class="node-title">◈ urgent_merge</text>
    <text x="290" y="430" text-anchor="middle" class="node-sub">MergeStatusOperator</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="210" y="472" width="160" height="38" rx="19" fill="#161b22" stroke="#3fb950" stroke-width="2" />
    <text x="290" y="496" text-anchor="middle" class="ok-text">✓ urgent_done</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="472" width="160" height="38" rx="19" fill="#161b22" stroke="#3fb950" stroke-width="2" />
    <text x="720" y="496" text-anchor="middle" class="ok-text">✓ normal_done</text>
  </g>

  <!-- ==================== LEGEND ==================== -->
  <line x1="50" y1="538" x2="78" y2="538" stroke="#f0883e" stroke-width="2" />
  <text x="86" y="542" class="node-sub">urgent branch</text>
  <line x1="190" y1="538" x2="218" y2="538" stroke="#58a6ff" stroke-width="2" />
  <text x="226" y="542" class="node-sub">normal branch</text>
  <text x="340" y="542" class="node-sub">♻ reused class with mapped keys</text>
  <text x="830" y="542" text-anchor="end" class="node-sub">Only the returned branch executes</text>
</svg>
